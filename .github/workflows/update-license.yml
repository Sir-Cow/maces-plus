name: Update License Year

on:
  schedule:
    # Runs at 00:00 on January 1st every year
    - cron: '0 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-license:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branch:
          - 26.3
          - 26.2
          - 26.1.x
          - 1.21.11
          - 1.21.10
          - 1.21.6
          - 1.21.5
          - 1.21.4
          - 1.21.3
          - 1.21.1
          - 1.20.6
          - 1.20.4
          - 1.20.2
          - 1.20.1
          - 1.19.4
          - 1.19.2
          - 1.19
          - 1.18.2
          - 1.18.1
          - 1.17.1
          - 1.12.2-forge
          - 1.8.9-forge

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update License Year
        shell: bash
        run: |
          CURRENT_YEAR=$(date +%Y)
          LICENSE_FILE="LICENSE"

          if [ ! -f "$LICENSE_FILE" ]; then
            echo "Error: $LICENSE_FILE not found."
            exit 1
          fi

          sed -i -E "s/([0-9]{4})(-[0-9]{4})?/$CURRENT_YEAR/g" "$LICENSE_FILE"

      - name: Commit and Push Changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LICENSE

          if ! git diff --cached --quiet; then
            git commit -m "chore: update license year"
            git push origin "HEAD:${{ matrix.branch }}"
          else
            echo "License year is already up to date."
          fi